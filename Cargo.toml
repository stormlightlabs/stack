[workspace]
members = ["crates/sltk-core", "crates/sltk-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/stormlightlabs/stack"
homepage = "https://github.com/stormlightlabs/stack"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
lzma-rs = "0.3"
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
thiserror = "2"
toml = "1.1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.dist]
inherits = "release"
lto = "thin"
