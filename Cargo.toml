[workspace]
members = ["crates/sltk-core", "crates/sltk-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/stormlightlabs/stack"
homepage = "https://github.com/stormlightlabs/stack"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
