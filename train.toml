# The release train: one tested version of each tool. The sltk binary embeds
# this file, so a new train needs a new sltk release.
#
# `url` is a template: sltk replaces {version} with the tool's version and
# {archive} with the platform's archive name. Copy each sha256 from the
# `.sha256` file dist publishes beside the archive. `setup` lists the commands
# that set a repository up, each as its program and arguments.
#
# After a change to fab's version, put the new fab first on PATH and run
# `cargo test -p sltk-core --test pinned_fab -- --ignored`. It checks that
# fab still accepts the [tasks] table sltk appends to .github/fabrial.toml.

[[tool]]
name = "fab"
tier = "essential"
binary = "fab"
version = "0.9.1"
url = "https://github.com/stormlightlabs/fabrial/releases/download/v{version}/{archive}"
setup = [["fab", "init"]]

[tool.platforms.aarch64-apple-darwin]
archive = "fab-cli-aarch64-apple-darwin.tar.xz"
sha256 = "af096b23238b217b1c5a5274f16af164632bc7a45fbce39ce2f3d86191851be7"

[tool.platforms.x86_64-unknown-linux-gnu]
archive = "fab-cli-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "6472cf6f53b655aafdd09d08e0bda4e2606d2519a21afae34f9caee88e67bf97"

[[tool]]
name = "arcl"
tier = "essential"
binary = "arcl"
version = "0.3.0"
url = "https://github.com/stormlightlabs/arclightning/releases/download/v{version}/{archive}"
setup = [["arcl", "init", "--workspace"], ["arcl", "skill", "install"]]

[tool.platforms.aarch64-apple-darwin]
archive = "arcl-cli-aarch64-apple-darwin.tar.xz"
sha256 = "7cf3c94e04bac6c9dff4fd357fc8133050fe0dbbca9d4d1dab2e4ecd8c5e13c3"

# arcl publishes no gnu archive: this platform takes its static musl build.
[tool.platforms.x86_64-unknown-linux-gnu]
archive = "arcl-cli-x86_64-unknown-linux-musl.tar.xz"
sha256 = "80f6bc7e4ce41f7037c91330c814d94e277aed381d192960d00a130a859675e3"
